
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRIPORA | Create Account</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <header class="navbar">
        <a href="/" class="logo">TRIPORA<span>.</span></a>
        <a href="/" class="login-btn">Home</a>
    </header>

    <main class="auth-page">

        <section class="auth-card">

            <p class="eyebrow">START YOUR JOURNEY</p>

            <h1>Create your <span>account.</span></h1>

            <p class="auth-description">
                Join TRIPORA and manage your journeys in one place.
            </p>

            {% if error %}
                <div class="error-message">{{ error }}</div>
            {% endif %}

            <form method="POST" action="{{ url_for('register') }}">

                <div class="field">
                    <label for="full_name">FULL NAME</label>
                    <input
                        type="text"
                        id="full_name"
                        name="full_name"
                        placeholder="Enter your full name"
                        maxlength="100"
                        value="{{ request.form.get('full_name', '') }}"
                        required
                    >
                </div>

                <div class="field">
                    <label for="email">EMAIL ADDRESS</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        value="{{ request.form.get('email', '') }}"
                        required
                    >
                </div>

                <div class="field">
                    <label for="password">PASSWORD</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Minimum 8 characters"
                        minlength="8"
                        required
                    >
                </div>

                <button type="submit" class="confirm-btn">
                    Create Account →
                </button>

            </form>

            <p class="auth-switch">
                Already have an account?
                <a href="{{ url_for('login') }}">Login</a>
            </p>

        </section>

    </main>

    <footer>
        <p>TRIPORA © 2026 | Travel. Discover. Experience.</p>
    </footer>

</body>
</html>
